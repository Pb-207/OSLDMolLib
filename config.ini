[GLOBAL]
# ---------------- compute resources (used by lib.py when writing .gjf files) ----------------
n_cores = 90
max_ram = 720
max_disk = 1000
n_para = 3

# ---------------- run environment (read by lib.py, passed to initialize.sh) ----------------
# Paths may use ~. Leave a value empty to keep the default of initialize.sh.
# g16root: parent directory that holds g16/, i.e. $g16root/g16/bsd/g16.profile must exist
g16root = ~
# Full path of g16.profile; empty means $g16root/g16/bsd/g16.profile
g16_profile =
# Source g16.profile to inherit its PATH / GAUSS_EXEDIR and related settings
source_g16_profile = True
# Gaussian scratch directory (GAUSS_SCRDIR): the calculations write a large amount of
# scratch data here and generate intensive read and write traffic, so a dedicated
# high-speed SSD is recommended.
# initialize.sh creates it if missing and makes it writable (chmod 777)
# e.g. gauss_scrdir = /media/<user>/LLM/g16/scratch
gauss_scrdir = ~/g16_scratch
# Multiwfn directory (leave empty if no SA calculation is needed)
multiwfn_path = ~/Multiwfn
# OpenMP / default memory for Gaussian
omp_thread_limit = 256
omp_stacksize = 4096M
gauss_memdef = 512GB
# Run ulimit -s unlimited (stack size)
ulimit_stack_unlimited = True

# ---------------- machine tuning (needs sudo; failures are warnings only) ----------------
# Set to False to leave CPU frequency scaling untouched
tune_cpu = True
cpu_max_freq = 3.7GHz
cpu_governor = performance

[S0OPT]
basis_set = 6-31g(d)
method = b3lyp

[S0ABS]
enable = True
basis_set = def2tzvp
method = cam-b3lyp
n_states = 5

[S1OPT]
enable = True
basis_set = 6-31g(d)
method = b3lyp
n_states = 3

[S1ABS]
basis_set = def2tzvp
method = cam-b3lyp
n_states = 50

[T1OPT]
enable = True
basis_set = 6-31g(d)
method = b3lyp

[T1ABS]
basis_set = def2tzvp
method = m062x
n_states = 20

[E0OPT]
enable = True
basis_set = 6-31g(d)
method = b3lyp

[E0ABS]
basis_set = def2tzvp
method = cam-b3lyp
n_states = 20

[H0OPT]
enable = True
basis_set = 6-31g(d)
method = b3lyp

[H0ABS]
basis_set = def2tzvp
method = cam-b3lyp
n_states = 20

[GRAPH]
fwhm = 75
min_wavelen = 200
max_wavelen = 1000
wavelen_step = 1
abs_color = red
em_color = cyan
sa_color = blue
ta_color = green
ea_color = orange
ha_color = yellow
dpi = 500
